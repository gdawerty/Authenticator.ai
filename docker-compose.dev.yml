# Development overrides for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    volumes:
      # Mount source code for hot reload during development
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/tmp_uploads:/app/tmp_uploads
      - ./backend/logs:/app/logs
      - ./data:/app/data
      # Exclude compiled Python files
      - /app/__pycache__
      - /app/**/__pycache__
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # Enable hot reload
    command: >
      bash -c "pip install watchdog &&
               python3 app_unified_sqlserver.py"

  frontend:
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HMR_PORT=24678
      - CHOKIDAR_USEPOLLING=true
    # Enable hot module replacement
    command: npm run dev -- --host 0.0.0.0 --port 5174

  # Add pgAdmin for SQL Server management (optional)
  sqlserver-management:
    image: dbeaver/cloudbeaver:latest
    container_name: authenticator_db_admin
    ports:
      - "8082:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - authenticator_network
    depends_on:
      - sqlserver

volumes:
  cloudbeaver_data:
    driver: local
