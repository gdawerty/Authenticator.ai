services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: authenticator_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SecurePassword123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backend/sql:/docker-entrypoint-initdb.d
    networks:
      - authenticator_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P SecurePassword123! -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authenticator_backend
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASS=SecurePassword123!
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/tmp_uploads:/app/tmp_uploads
      - ./data:/app/data
    networks:
      - authenticator_network
    # depends_on:
    #   sqlserver:
    #     condition: service_healthy
    restart: unless-stopped
    command: python3 app_unified.py

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authenticator_frontend
    environment:
      - VITE_API_URL=http://localhost:8001
      - NODE_ENV=development
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - authenticator_network
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  sqlserver_data:
    driver: local

networks:
  authenticator_network:
    driver: bridge
