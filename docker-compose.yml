services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: authenticator_postgres
    environment:
      - POSTGRES_USER=authenticator
      - POSTGRES_PASSWORD=SecurePassword123!
      - POSTGRES_DB=authenticator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    networks:
      - authenticator_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenticator -d authenticator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authenticator_backend
    environment:
      - DATABASE_URL=postgresql://authenticator:SecurePassword123!@postgres:5432/authenticator_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=authenticator
      - DB_PASS=SecurePassword123!
      - DB_NAME=authenticator_db
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/workspace
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/workspace/backend
      - ./backend/uploads:/workspace/backend/uploads
      - ./backend/tmp_uploads:/workspace/backend/tmp_uploads
      - ./data:/workspace/data
    networks:
      - authenticator_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python3 app_unified.py

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authenticator_frontend
    environment:
      - VITE_API_URL=http://localhost:8001
      - NODE_ENV=development
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - authenticator_network
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5174

volumes:
  postgres_data:
    driver: local

networks:
  authenticator_network:
    driver: bridge
